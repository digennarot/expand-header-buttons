<section class="ehb-config-body">
  <p class="hint ehb-config-intro">
    Checked buttons appear in the <strong>sidebar</strong>.
    Unchecked buttons stay where they were: in the three-dot menu, or in the title bar on V1 sheets.
  </p>

  {{#if controls.length}}
    <div class="ehb-config-toolbar">
      <button type="button" data-action="toggleAll" data-state="on">
        <i class="fa-solid fa-square-check" inert></i> All
      </button>
      <button type="button" data-action="toggleAll" data-state="off">
        <i class="fa-regular fa-square" inert></i> None
      </button>
    </div>

    <ul class="ehb-config-list">
      {{#each controls}}
        <li class="ehb-config-item{{#if missing}} ehb-missing{{/if}}">
          <label>
            <input type="checkbox" name="{{field}}" {{checked enabled}}>
            <span class="ehb-icon" aria-hidden="true">
              {{#if iconClass}}<i class="{{iconClass}}" inert></i>{{/if}}
            </span>
            <span class="ehb-btn-label" data-tooltip-text="{{label}}">{{label}}</span>
            {{#if missing}}
              <span class="ehb-tag" data-tooltip-text="Saved setting. No open sheet shows this button right now.">not open</span>
            {{else if action}}
              <code class="ehb-action-id">{{action}}</code>
            {{/if}}
          </label>
        </li>
      {{/each}}
    </ul>
  {{else}}
    <p class="ehb-config-empty">
      <i class="fa-solid fa-triangle-exclamation" inert></i>
      No buttons found!<br>
      Open a sheet first, then open this configuration again.
    </p>
  {{/if}}
</section>
